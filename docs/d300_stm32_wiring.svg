<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="760" viewBox="0 0 1280 760" role="img" aria-labelledby="title desc">
  <title id="title">D300 ile NUCLEO-L152RE bağlantı şeması</title>
  <desc id="desc">D300 sensörün 5 volt besleme, ortak toprak, PB10 SCL, PB11 SDA ve 3.3 volta bağlı iki 4.7 kiloohm I2C pull-up direnci ile bağlantısı.</desc>
  <defs>
    <style>
      text{font-family:Segoe UI,Arial,sans-serif;fill:#102432}.title{font-size:30px;font-weight:800}.sub{font-size:15px;fill:#526875}.head{font-size:20px;font-weight:800}.pin{font-family:Consolas,monospace;font-size:15px;font-weight:700}.label{font-size:14px;font-weight:650}.small{font-size:12px;fill:#526875}.box{fill:#fff;stroke:#91a8b5;stroke-width:2}.mcu{fill:#eaf7fb;stroke:#168da4;stroke-width:3}.sensor{fill:#edf9f1;stroke:#3e9b6b;stroke-width:3}.warn{fill:#fff7df;stroke:#d49b24;stroke-width:2}.rail5{stroke:#e3343f;stroke-width:5;fill:none}.rail3{stroke:#ef8b20;stroke-width:4;fill:none}.gnd{stroke:#202f38;stroke-width:5;fill:none}.scl{stroke:#26a65b;stroke-width:5;fill:none}.sda{stroke:#2379d8;stroke-width:5;fill:none}.thin{stroke:#ef8b20;stroke-width:3;fill:none}.node{fill:#ef8b20}.divider{stroke:#cbd6dc;stroke-width:1}.danger{font-size:14px;font-weight:800;fill:#ad2731}
    </style>
  </defs>
  <rect width="1280" height="760" fill="#f4f7f8"/>
  <text x="42" y="52" class="title">D300 · STM32 I2C2 bağlantısı</text>
  <text x="42" y="80" class="sub">NUCLEO-L152RE · firmware v3.3.0 · D300 adresi 0x76 · I2C lojik seviyesi 3.3 V</text>

  <rect x="55" y="125" width="410" height="465" rx="18" class="box mcu"/>
  <text x="82" y="163" class="head">NUCLEO-L152RE</text>
  <text x="82" y="189" class="small">STM32L152RET6 · Morpho/Arduino başlıkları</text>
  <line x1="82" y1="208" x2="438" y2="208" class="divider"/>

  <rect x="85" y="238" width="350" height="52" rx="9" fill="#fff"/>
  <text x="105" y="270" class="pin">CN6-5  +5V</text>
  <circle cx="425" cy="264" r="7" fill="#e3343f"/>
  <rect x="85" y="312" width="350" height="52" rx="9" fill="#fff"/>
  <text x="105" y="344" class="pin">CN6-6  GND</text>
  <circle cx="425" cy="338" r="7" fill="#202f38"/>
  <rect x="85" y="386" width="350" height="52" rx="9" fill="#fff"/>
  <text x="105" y="418" class="pin">CN6-4  +3V3</text>
  <circle cx="425" cy="412" r="7" fill="#ef8b20"/>
  <rect x="85" y="460" width="350" height="52" rx="9" fill="#fff"/>
  <text x="105" y="492" class="pin">CN10-25  PB10 / I2C2_SCL</text>
  <circle cx="425" cy="486" r="7" fill="#26a65b"/>
  <rect x="85" y="534" width="350" height="52" rx="9" fill="#fff"/>
  <text x="105" y="566" class="pin">CN10-18  PB11 / I2C2_SDA</text>
  <circle cx="425" cy="560" r="7" fill="#2379d8"/>

  <rect x="900" y="172" width="320" height="360" rx="18" class="box sensor"/>
  <text x="930" y="211" class="head">D300 · MS5837-30BA</text>
  <text x="930" y="238" class="small">D300 kartı: 4.5–5.5 V giriş, 3.3 V I2C</text>
  <line x1="930" y1="256" x2="1190" y2="256" class="divider"/>
  <circle cx="925" cy="294" r="7" fill="#e3343f"/>
  <text x="948" y="300" class="pin">KIRMIZI · VCC 5V</text>
  <circle cx="925" cy="362" r="7" fill="#202f38"/>
  <text x="948" y="368" class="pin">SİYAH · GND</text>
  <circle cx="925" cy="430" r="7" fill="#26a65b"/>
  <text x="948" y="436" class="pin">YEŞİL · SCL</text>
  <circle cx="925" cy="498" r="7" fill="#2379d8"/>
  <text x="948" y="504" class="pin">MAVİ · SDA</text>

  <path d="M425 264 H925 V294" class="rail5"/>
  <path d="M425 338 H860 V362 H925" class="gnd"/>
  <path d="M425 486 H760 V430 H925" class="scl"/>
  <path d="M425 560 H810 V498 H925" class="sda"/>

  <path d="M425 412 H650" class="rail3"/>
  <circle cx="570" cy="412" r="6" class="node"/>
  <circle cx="650" cy="412" r="6" class="node"/>
  <path d="M570 412 V440" class="thin"/>
  <rect x="548" y="440" width="44" height="70" rx="5" fill="#fff7df" stroke="#ef8b20" stroke-width="2"/>
  <path d="M570 510 V486" class="thin"/>
  <text x="500" y="458" class="label">4.7 kΩ</text>
  <text x="500" y="476" class="small">SCL pull-up</text>
  <path d="M650 412 V514" class="thin"/>
  <rect x="628" y="514" width="44" height="70" rx="5" fill="#fff7df" stroke="#ef8b20" stroke-width="2"/>
  <path d="M650 584 V560" class="thin"/>
  <text x="681" y="544" class="label">4.7 kΩ</text>
  <text x="681" y="590" class="small">SDA pull-up</text>

  <rect x="505" y="620" width="715" height="92" rx="12" class="warn"/>
  <text x="530" y="651" class="danger">DİKKAT: Pull-up dirençleri 5 V'a değil yalnızca 3V3'a bağlanır.</text>
  <text x="530" y="677" class="label">Modülde pull-up zaten varsa ikinci seti eklemeyin. Kablo renginden önce SDA/SCL etiketini doğrulayın.</text>
  <text x="530" y="699" class="small">IMU bu hattan ayrıdır: IMU = I2C1/PB8/PB9 · D300 = I2C2/PB10/PB11</text>

  <text x="55" y="642" class="small">Boşta beklenen ölçüm: kırmızı–siyah ≈ 5 V</text>
  <text x="55" y="666" class="small">yeşil–siyah ≈ 3.3 V · mavi–siyah ≈ 3.3 V</text>
  <text x="55" y="690" class="small">Adres taraması: 7-bit 0x76</text>
</svg>
